[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crc10-gsm"
version = "0.1.0"
description = "Pure-Python CRC-10/GSM (3GPP TS 44.006) reference implementation, zero runtime deps"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
